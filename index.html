<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple Persian RTL to-do list app for daily planning."
    />
    <title>کارهای من</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <p class="eyebrow">برنامه‌ریزی روزانه</p>
        <h1>کارهای من</h1>
        <p class="subtitle">قدم‌های کوچک، نتیجه‌های بزرگ.</p>
      </header>

      <section class="todo-card" aria-labelledby="todo-heading">
        <div class="card-heading">
          <div>
            <h2 id="todo-heading">فهرست کارها</h2>
            <p class="date-label">امروز، یک روز تازه برای شروع است</p>
          </div>
        </div>

        <div class="add-task">
          <label class="visually-hidden" for="new-task">کار جدید</label>
          <input
            id="new-task"
            class="task-input"
            type="text"
            placeholder="چه کاری باید انجام شود؟"
            autocomplete="off"
            aria-describedby="task-error"
          />
          <button class="add-button" type="button" aria-label="افزودن کار">
            +
          </button>
        </div>

        <p class="task-error" id="task-error" role="alert" aria-live="polite" hidden></p>

        <ul class="task-list" aria-label="کارها"></ul>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
