<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="یک فهرست ساده برای برنامه‌ریزی کارهای روزانه"
    />
    <title>کارهای من</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <p class="eyebrow">برنامه‌ریزی روزانه</p>
        <h1>کارهای من</h1>
        <p class="subtitle">قدم‌های کوچک، نتیجه‌های بزرگ.</p>
      </header>

      <section class="todo-card" aria-labelledby="todo-heading">
        <div class="card-heading">
          <div>
            <h2 id="todo-heading">فهرست کارها</h2>
            <p class="date-label">امروز، یک روز تازه برای شروع است</p>
          </div>
          <span class="task-count" aria-label="۳ کار">۰۳</span>
        </div>

        <div class="add-task">
          <label class="visually-hidden" for="new-task">کار جدید</label>
          <input
            id="new-task"
            class="task-input"
            type="text"
            placeholder="چه کاری باید انجام شود؟"
            autocomplete="off"
          />
          <button class="add-button" type="button" aria-label="افزودن کار">
            +
          </button>
        </div>

        <ul class="task-list" aria-label="کارها">
          <li class="task-item">
            <label class="task-label">
              <input class="task-checkbox" type="checkbox" />
              <span class="custom-checkbox" aria-hidden="true"></span>
              <span class="task-text">مرتب کردن میز کار</span>
            </label>
            <div class="task-actions">
              <button class="edit-button" type="button" aria-label="ویرایش مرتب کردن میز کار">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m14 5 5 5M4 20l4.5-1 10.2-10.2a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z" />
                </svg>
              </button>
              <button class="delete-button" type="button" aria-label="حذف مرتب کردن میز کار">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16M10 11v6m4-6v6M5.5 7l1 13h11l1-13M9 7V4h6v3" />
                </svg>
              </button>
            </div>
          </li>

          <li class="task-item is-completed">
            <label class="task-label">
              <input class="task-checkbox" type="checkbox" checked />
              <span class="custom-checkbox" aria-hidden="true"></span>
              <span class="task-text">خریدن دفتر یادداشت</span>
            </label>
            <div class="task-actions">
              <button class="edit-button" type="button" aria-label="ویرایش خریدن دفتر یادداشت">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m14 5 5 5M4 20l4.5-1 10.2-10.2a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z" />
                </svg>
              </button>
              <button class="delete-button" type="button" aria-label="حذف خریدن دفتر یادداشت">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16M10 11v6m4-6v6M5.5 7l1 13h11l1-13M9 7V4h6v3" />
                </svg>
              </button>
            </div>
          </li>

          <li class="task-item">
            <label class="task-label">
              <input class="task-checkbox" type="checkbox" />
              <span class="custom-checkbox" aria-hidden="true"></span>
              <span class="task-text">خواندن چند صفحه کتاب</span>
            </label>
            <div class="task-actions">
              <button class="edit-button" type="button" aria-label="ویرایش خواندن چند صفحه کتاب">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m14 5 5 5M4 20l4.5-1 10.2-10.2a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z" />
                </svg>
              </button>
              <button class="delete-button" type="button" aria-label="حذف خواندن چند صفحه کتاب">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16M10 11v6m4-6v6M5.5 7l1 13h11l1-13M9 7V4h6v3" />
                </svg>
              </button>
            </div>
          </li>
        </ul>

        <footer class="card-footer">
          <span>۲ کار باقی‌مانده</span>
          <button class="clear-button" type="button">پاک کردن انجام‌شده‌ها</button>
        </footer>
      </section>

      <p class="footer-note">برای شروع، اولین کار امروزت را بنویس.</p>
    </main>
  </body>
</html>
